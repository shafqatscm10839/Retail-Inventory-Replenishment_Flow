name: Retail Inventory Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl

      - name: Generate synthetic retail data
        run: python src/generate_data.py

      - name: Run ETL and Excel reporting pipeline
        run: python src/pipeline.py

      - name: Upload generated Excel & BI outputs
        uses: actions/upload-artifact@v4
        with:
          name: retail-inventory-outputs
          path: outputs/
